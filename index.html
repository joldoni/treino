<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Treino</title>
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  --bg:#0d0f12; --surface:#171a1f; --surface2:#1f242b; --line:#2b313a;
  --text:#e9ecf1; --muted:#98a2ae; --dim:#6b7480;
  --accent:#4f8cff; --accent-dim:#1e3a6b;
  --ok:#34d399; --ok-dim:#123c30;
  --warn:#f0b429; --danger:#f26d6d;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
body{padding-top:var(--safe-top)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:none;cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.01em}
a{color:var(--accent)}

#app{padding:0 16px 120px;max-width:640px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* ---------- topo ---------- */
.top{padding:18px 0 6px}
.top .date{color:var(--muted);font-size:14px}
.top h1{font-size:26px;margin-top:2px}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tight{padding:13px 14px}
.card h2{font-size:17px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);
  font-size:16px;font-weight:600;color:var(--text)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px;padding:19px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06281d}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#4a2626}
.btn.sm{padding:11px 14px;font-size:14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:#2f5fa8;color:#cfe0ff}
.chip.ok{background:var(--ok-dim);border-color:#1d6b53;color:#8ff0cd}

/* ---------- estatísticas ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- exercícios ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ex.done{border-color:#1d6b53}
.ex-head{padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
.ex-num{width:26px;height:26px;flex:none;border-radius:8px;background:var(--surface2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.ex.done .ex-num{background:var(--ok);color:#06281d}
.ex-name{font-size:17px;font-weight:650;line-height:1.25}
.ex-meta{color:var(--muted);font-size:13px;margin-top:3px}
.ex-body{padding:0 15px 15px}
.hist{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.hist b{color:var(--text);font-weight:600}
.note{font-size:13px;border-radius:10px;padding:10px 11px;margin-bottom:12px;line-height:1.4}
.note.warn{background:#3a2f10;color:#ffd97a;border:1px solid #5c4a17}
.note.info{background:#152a3f;color:#a8cdf5;border:1px solid #22456a}
.note.ok{background:var(--ok-dim);color:#8ff0cd;border:1px solid #1d6b53}

.set{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.set-n{width:16px;flex:none;font-size:13px;color:var(--dim);font-weight:700;text-align:center}
.field{flex:1;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:11px;height:52px;min-width:0}
.field button{width:34px;height:100%;font-size:20px;color:var(--muted);flex:none}
.field button:active{color:var(--text)}
.field input{flex:1;min-width:0;width:100%;background:none;border:none;text-align:center;
  font-size:17px;font-weight:650;padding:0;outline:none}
.field input::placeholder{color:var(--dim);font-weight:500;font-size:15px}
.setheads{display:flex;gap:6px;margin-bottom:5px;padding-left:22px}
.setheads span{flex:1;font-size:11px;color:var(--dim);text-align:center;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.setheads i{width:48px;flex:none}
.tick{width:48px;height:52px;flex:none;border-radius:11px;background:var(--surface2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim)}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:#06281d}
.set.done .field{background:transparent;border-color:#1d6b53;opacity:.85}
.set.done .field button{opacity:0}
.addset{font-size:13px;color:var(--muted);padding:8px 0}

/* ---------- barra inferior ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(13,15,18,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-bot)}
.tabs button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;color:var(--dim);font-weight:600}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
body.focus .tabs{display:none}

.sticky-bot{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 16px calc(12px + var(--safe-bot));
  background:linear-gradient(to top,var(--bg) 62%,transparent);max-width:640px;margin:0 auto}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:8px 16px calc(24px + var(--safe-bot));border-top:1px solid var(--line);
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(22px)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 14px}
.sheet h2{font-size:20px;margin-bottom:4px}
.sheet ul{margin:8px 0;padding-left:20px}
.sheet li{margin-bottom:7px;font-size:15px;color:var(--muted)}
.sheet li b{color:var(--text)}
.opt{width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--line);margin-bottom:8px}
.opt .t{font-weight:650}
.opt .d{font-size:13px;color:var(--muted);margin-top:2px}

/* ---------- formulários ---------- */
.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:14px;outline:none;margin-top:6px}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none}
textarea.inp{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.check .box{width:24px;height:24px;flex:none;border-radius:7px;border:1.8px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.check.on .box{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- timer ---------- */
#rest{position:fixed;left:16px;right:16px;bottom:calc(78px + var(--safe-bot));z-index:50;display:none;
  background:var(--accent);color:#fff;border-radius:13px;padding:13px 16px;
  align-items:center;justify-content:space-between;max-width:608px;margin:0 auto;font-weight:700}
#rest.on{display:flex}
#rest.done{background:var(--ok);color:#06281d}

/* ---------- histórico / evolução ---------- */
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
.hitem.skip{opacity:.62;border-style:dashed}
.hdetail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.hdetail div{margin-bottom:4px}
svg.chart{width:100%;height:170px;display:block;overflow:visible}
.chart .grid{stroke:#242a32;stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--dim);font-size:11px}
.empty{text-align:center;color:var(--dim);padding:34px 18px;font-size:15px}
</style>
</head>
<body>

<div id="app">
  <div id="v-home"     class="view active"></div>
  <div id="v-workout"  class="view"></div>
  <div id="v-cardio"   class="view"></div>
  <div id="v-history"  class="view"></div>
  <div id="v-progress" class="view"></div>
  <div id="v-settings" class="view"></div>
</div>

<div id="rest"><span id="rest-t">45s</span><button id="rest-x" style="color:inherit;font-weight:700">Pular</button></div>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.6V21h14V9.6"/></svg>Início</button>
  <button data-tab="cardio"><svg viewBox="0 0 24 24"><path d="M20.8 6.6a5 5 0 0 0-8.8-1.9A5 5 0 0 0 3.2 6.6c-1 3 1.4 6 8.8 11.9 7.4-5.9 9.8-8.9 8.8-11.9Z"/></svg>Cardio</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3.5 2"/></svg>Histórico</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-6"/><path d="M11 20V8"/><path d="M16 20v-9"/><path d="M21 20V5"/></svg>Evolução</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-3-1.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.9h-.2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.3-3l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 2.9-1.2v-.2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 3 1.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg>Ajustes</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<!-- O ?v= força o navegador a baixar a versão nova a cada atualização.
     Ao publicar mudanças em data.js ou app.js, incremente o número aqui
     e a constante CACHE em sw.js. -->
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
